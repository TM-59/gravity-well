# Style tools for the C code and the Python scripts under scripts/, pinned by uv.lock.
[project]
name = "gravity-well-style"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
dev = ["clang-format==23.1.5", "clang-tidy==23.1.4", "ruff==0.17.5", "mypy==2.4.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Only rules the tool itself declares incompatible are left out; no code is excluded.
ignore = [
  # D203 and D211 are mutually exclusive (Ruff warns); keep D211 (no blank line before a class docstring).
  "D203",
  # D212 and D213 are mutually exclusive (Ruff warns); keep D212 (summary on the first line).
  "D213",
  # Conflicts with `ruff format` (Ruff documents it as unsafe to combine with the formatter).
  "COM812",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["scripts"]
